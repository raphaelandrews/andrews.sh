<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>virtual pet — andrews.sh</title>
  <meta name="description" content="Adopt a pixel cat." />
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="/favicon.svg" />
</head>

<body>
  <div id="retro-nav"></div>

  <div id="page">
    <div class="page-box">
      <h1>virtual pet</h1>
      <p>this is pixel. pixel is a cat. pixel lives in a cookie. please take care of pixel.</p>

      <div class="pet-stage">
        <img id="pet-image" src="/images/gifs/black-cat.gif" alt="pixel the cat" />
        <p id="pet-message">pixel is waiting for you.</p>
      </div>

      <div class="pet-stats">
        <div class="pet-stat">hunger: <span class="bar" id="pet-hunger-bar"></span> <span id="pet-hunger-text"></span></div>
        <div class="pet-stat">happiness: <span class="bar" id="pet-happy-bar"></span> <span id="pet-happy-text"></span></div>
        <div class="pet-stat">energy: <span class="bar" id="pet-energy-bar"></span> <span id="pet-energy-text"></span></div>
      </div>

      <div class="pet-actions">
        <button type="button" onclick="feedPet(); return false;">feed</button>
        <button type="button" onclick="playPet(); return false;">play</button>
        <button type="button" onclick="sleepPet(); return false;">sleep</button>
        <button type="button" onclick="resetPet(); return false;">reset</button>
      </div>

      <div class="construction">🚧 pixel cannot die · the cookie will outlive us all 🚧</div>

      <p><a href="/">home</a> · <a href="/guestbook.html">tell pixel you said hi</a></p>
    </div>
  </div>

  <div id="retro-footer"></div>
  <script src="/retro.js"></script>
  <script>
    function petValue(name, fallback) {
      var value = parseInt(getCookie(name), 10);
      return isNaN(value) ? fallback : value;
    }

    function clamp(value) {
      if (value < 0) {
        return 0;
      }
      if (value > 100) {
        return 100;
      }
      return value;
    }

    function petSave(hunger, happy, energy) {
      setCookie('pet_hunger', clamp(hunger), 365);
      setCookie('pet_happy', clamp(happy), 365);
      setCookie('pet_energy', clamp(energy), 365);
    }

    function petState() {
      return {
        hunger: petValue('pet_hunger', 70),
        happy: petValue('pet_happy', 70),
        energy: petValue('pet_energy', 70)
      };
    }

    function updatePet() {
      var state = petState();
      var image = document.getElementById('pet-image');

      document.getElementById('pet-hunger-bar').style.width = state.hunger + '%';
      document.getElementById('pet-happy-bar').style.width = state.happy + '%';
      document.getElementById('pet-energy-bar').style.width = state.energy + '%';
      document.getElementById('pet-hunger-text').innerHTML = state.hunger + '%';
      document.getElementById('pet-happy-text').innerHTML = state.happy + '%';
      document.getElementById('pet-energy-text').innerHTML = state.energy + '%';

      if (state.happy > 80) {
        image.src = '/images/gifs/sailor-moon-cat.gif';
      } else {
        image.src = '/images/gifs/black-cat.gif';
      }
    }

    function feedPet() {
      var state = petState();
      petSave(state.hunger + 20, state.happy + 5, state.energy + 5);
      document.getElementById('pet-message').innerHTML = 'pixel ate. pixel is pleased.';
      updatePet();
    }

    function playPet() {
      var state = petState();
      petSave(state.hunger - 5, state.happy + 20, state.energy - 10);
      document.getElementById('pet-message').innerHTML = 'pixel chased the cursor. worth it.';
      updatePet();
    }

    function sleepPet() {
      var state = petState();
      petSave(state.hunger - 5, state.happy + 5, state.energy + 25);
      document.getElementById('pet-message').innerHTML = 'pixel is asleep. do not refresh.';
      updatePet();
    }

    function resetPet() {
      petSave(70, 70, 70);
      document.getElementById('pet-message').innerHTML = 'pixel has been reset. a fresh start.';
      updatePet();
    }

    addOnload(updatePet);
  </script>
</body>

</html>
